name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: qrhub
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qrhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/qrhub
      FRONTEND_URL: https://7fitment.com
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      ADMIN_PASSWORD: ci-only-admin-password
      PORTAL_TOKEN_SECRET: ci-only-portal-secret-with-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - run: python -m pip install --upgrade pip
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check app tests alembic scripts
      - run: pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=json:coverage.json
      - run: python scripts/check_coverage.py
      - run: alembic upgrade head
      - run: pip-audit -r requirements.lock
      - run: pip-audit -r requirements-dev.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm audit --audit-level=high

  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t 7fitment-backend:ci backend
      - run: docker build -t 7fitment-frontend:ci frontend
      - name: Smoke test production containers
        run: |
          docker network create 7fitment-ci
          cleanup() {
            docker rm -f 7fitment-frontend-ci qrhub_backend 7fitment-db-ci >/dev/null 2>&1 || true
            docker network rm 7fitment-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name 7fitment-db-ci --network 7fitment-ci \
            -e POSTGRES_DB=qrhub \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            postgres:15-alpine
          for attempt in {1..30}; do
            docker exec 7fitment-db-ci pg_isready -U postgres -d qrhub && break
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          docker run -d --name qrhub_backend --network 7fitment-ci \
            -e DATABASE_URL=postgresql+asyncpg://postgres:postgres@7fitment-db-ci:5432/qrhub \
            -e FRONTEND_URL=http://7fitment-frontend-ci:3000 \
            -e INTERNAL_PROXY_SECRET=ci-only-proxy-secret \
            -e PORTAL_TOKEN_SECRET=ci-only-portal-secret-with-32-characters \
            -e ADMIN_PASSWORD=ci-only-admin-password \
            -e QR_COOKIE_SECURE=false \
            -e ADMIN_COOKIE_SECURE=false \
            7fitment-backend:ci
          for attempt in {1..30}; do
            docker exec qrhub_backend python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')" && break
            if [ "$attempt" -eq 30 ]; then docker logs qrhub_backend; exit 1; fi
            sleep 1
          done
          docker run -d --name 7fitment-frontend-ci --network 7fitment-ci \
            -e INTERNAL_PROXY_SECRET=ci-only-proxy-secret \
            -e NGINX_ENVSUBST_FILTER=INTERNAL_PROXY_SECRET \
            7fitment-frontend:ci
          for attempt in {1..20}; do
            docker exec 7fitment-frontend-ci wget -qO- http://127.0.0.1:3000/health && break
            if [ "$attempt" -eq 20 ]; then exit 1; fi
            sleep 1
          done
          docker exec 7fitment-frontend-ci wget -qO- http://127.0.0.1:3000/ >/dev/null
          docker exec 7fitment-frontend-ci wget -qO- http://127.0.0.1:3000/enlaces >/dev/null
          docker exec 7fitment-frontend-ci wget -qO- http://127.0.0.1:3000/admin/login >/dev/null
          docker exec 7fitment-frontend-ci wget -qO- \
            http://127.0.0.1:3000/assets/qr/7fitment-qr-general.svg >/dev/null
          docker exec 7fitment-frontend-ci wget -qO- http://qrhub_backend:8000/ready >/dev/null
