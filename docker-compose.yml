# =============================================================================
# QR-Hub Analytics - Docker Compose Orchestration
# =============================================================================
# Stack: PostgreSQL 15 | FastAPI | Vite/React (Nginx) | Metabase
#
# Usage:
#   cp .env.example .env           # fill in all required variables
#   docker compose up -d --build
#
# All services communicate over the internal "qrhub_net" bridge network.
# Only the ports listed under "ports" are exposed to the host.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # db - PostgreSQL 15
  # Stores QR scan analytics produced by the backend service.
  # Metabase connects to this database for BI reporting.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: qrhub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qrhub_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # backend - FastAPI (async, Python 3.12)
  # Handles QR redirect requests and records scan analytics via BackgroundTasks.
  # Depends on "db" being healthy before accepting traffic.
  # ---------------------------------------------------------------------------
  qrhub_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qrhub_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FRONTEND_URL: ${FRONTEND_URL}
      GEOIP_API_URL: ${GEOIP_API_URL:-https://ipwho.is}
      GEOIP_TIMEOUT_SECONDS: ${GEOIP_TIMEOUT_SECONDS:-2.5}
      QR_RATE_LIMIT_PER_MINUTE: ${QR_RATE_LIMIT_PER_MINUTE:-120}
      BROWSER_LOCATION_RATE_LIMIT_PER_MINUTE: ${BROWSER_LOCATION_RATE_LIMIT_PER_MINUTE:-4}
      TRACKING_EVENT_RATE_LIMIT_PER_MINUTE: ${TRACKING_EVENT_RATE_LIMIT_PER_MINUTE:-20}
      ADMIN_LOGIN_RATE_LIMIT_PER_MINUTE: ${ADMIN_LOGIN_RATE_LIMIT_PER_MINUTE:-5}
      QR_COOKIE_SECURE: ${QR_COOKIE_SECURE:-true}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:?INTERNAL_PROXY_SECRET must be configured}
      TRACKING_ANALYTICS_CAMPAIGNS: ${TRACKING_ANALYTICS_CAMPAIGNS:-qr_general}
      TRACKING_WHATSAPP_URL: ${TRACKING_WHATSAPP_URL:-https://wa.me/5215637940104?text=Hola%207Fitment%2C%20quiero%20cotizar%20un%20proyecto%20para%20mi%20auto}
      TRACKING_INSTAGRAM_URL: ${TRACKING_INSTAGRAM_URL:-https://www.instagram.com/7fitment/}
      PORTAL_TOKEN_SECRET: ${PORTAL_TOKEN_SECRET:?PORTAL_TOKEN_SECRET must be configured}
      PORTAL_TOKEN_TTL_SECONDS: ${PORTAL_TOKEN_TTL_SECONDS:-1800}
      MEDIA_TOKEN_TTL_SECONDS: ${MEDIA_TOKEN_TTL_SECONDS:-1800}
      MEDIA_ROOT: /srv/7fitment-media
      MEDIA_MAX_UPLOAD_MB: ${MEDIA_MAX_UPLOAD_MB:-250}
      RAW_ANALYTICS_RETENTION_DAYS: ${RAW_ANALYTICS_RETENTION_DAYS:-365}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    volumes:
      - media_data:/srv/7fitment-media
    # ports:
      # - "8000:8000"
    networks:
      - qrhub_net
      - dokploy-network
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.enable=true
      - "traefik.http.routers.qrhub-backend.rule=Host(`api.7fitment.com`) && PathPrefix(`/api`)"
      - traefik.http.routers.qrhub-backend.entrypoints=web
      - traefik.http.routers.qrhub-backend.priority=100
      - traefik.http.routers.qrhub-backend.service=qrhub-backend
      - traefik.http.services.qrhub-backend.loadbalancer.server.port=8000
      - "traefik.http.routers.qrhub-api.rule=Host(`api.7fitment.com`) && PathPrefix(`/api`)"
      - traefik.http.routers.qrhub-api.entrypoints=web
      - traefik.http.routers.qrhub-api.priority=110
      - traefik.http.routers.qrhub-api.service=qrhub-backend

  qrhub_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qrhub_worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MEDIA_ROOT: /srv/7fitment-media
      RAW_ANALYTICS_RETENTION_DAYS: ${RAW_ANALYTICS_RETENTION_DAYS:-365}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    volumes:
      - media_data:/srv/7fitment-media
    networks:
      - qrhub_net
    depends_on:
      db:
        condition: service_healthy
      qrhub_backend:
        condition: service_healthy

  qrhub_backup:
    image: postgres:15-alpine
    container_name: qrhub_backup
    restart: unless-stopped
    command: ["sh", "-c", "while true; do sh /usr/local/bin/backup.sh; sleep 86400; done"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./ops/backup.sh:/usr/local/bin/backup.sh:ro
      - media_data:/media:ro
      - backup_data:/backups
    networks:
      - qrhub_net
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # frontend - Vite + React + Tailwind CSS v4, served by Nginx on port 3000.
  # VITE_API_URL must point to the publicly reachable backend URL.
  # ---------------------------------------------------------------------------
  qrhub_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_DEFAULT_CAMPAIGN_ID: ${VITE_DEFAULT_CAMPAIGN_ID:-qr_general}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-https://7fitment.com}
    container_name: qrhub_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:?INTERNAL_PROXY_SECRET must be configured}
      NGINX_ENVSUBST_FILTER: INTERNAL_PROXY_SECRET
    volumes:
      - media_data:/srv/media:ro
   # ports:
    #  - "3000:3000"
    networks:
      - qrhub_net
      - dokploy-network
    depends_on:
      - qrhub_backend
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.enable=true
      - traefik.http.routers.hostweb-qrhubprod-9flizk-3-web.rule=Host(`7fitment.com`)
      - traefik.http.routers.hostweb-qrhubprod-9flizk-3-web.entrypoints=web
      - traefik.http.routers.hostweb-qrhubprod-9flizk-3-web.service=hostweb-qrhubprod-9flizk-3-web
      - traefik.http.services.hostweb-qrhubprod-9flizk-3-web.loadbalancer.server.port=3000
      # Admin subdomain labels
      - traefik.http.routers.hostweb-qrhubprod-9flizk-admin.rule=Host(`admin.7fitment.com`)
      - traefik.http.routers.hostweb-qrhubprod-9flizk-admin.entrypoints=web
      - traefik.http.routers.hostweb-qrhubprod-9flizk-admin.service=hostweb-qrhubprod-9flizk-3-web

  # ---------------------------------------------------------------------------
  # metabase - Business Intelligence (official Metabase image)
  # Connect Metabase to the "db" service (host: db, port: 5432) to create
  # dashboards over the "scans" table without extra ETL.
  # ---------------------------------------------------------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: qrhub_metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE:   h2
      JAVA_TIMEZONE: UTC
    volumes:
      - metabase_data:/metabase-data
    ports:
      - "3001:3000"
    networks:
      - qrhub_net
    depends_on:
      - db

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  metabase_data:
    driver: local
  media_data:
    driver: local
  backup_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  qrhub_net:
    driver: bridge
  dokploy-network:
    external: true
