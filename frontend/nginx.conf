map $http_cf_connecting_ip $qr_client_ip {
  default $http_cf_connecting_ip;
  "" $remote_addr;
}

map $host $tracking_global_key {
  default "7fitment-global";
}

limit_req_zone $qr_client_ip zone=browser_location:10m rate=4r/m;
limit_req_zone $qr_client_ip zone=tracking_events:10m rate=20r/m;
limit_req_zone $qr_client_ip zone=qr_redirects:10m rate=120r/m;
limit_req_zone $qr_client_ip zone=admin_login:10m rate=5r/m;
limit_req_zone $tracking_global_key zone=qr_global:1m rate=600r/m;
limit_req_zone $tracking_global_key zone=tracking_global:1m rate=240r/m;

server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https://api.7fitment.com https://nominatim.openstreetmap.org; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  location /assets/qr/ {
    expires off;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate";
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /media/public/ {
    alias /srv/media/derivatives/public/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  limit_req_status 429;

  location ~ ^/(r|t|qr)(/|$) {
    limit_req zone=qr_redirects burst=30 nodelay;
    limit_req zone=qr_global burst=120 nodelay;
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    proxy_intercept_errors on;
    error_page 429 502 503 504 = @qr_fallback;
    proxy_pass http://qrhub_backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $qr_client_ip;
    proxy_set_header X-Real-IP $qr_client_ip;
    proxy_set_header X-Forwarded-For $qr_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-QRHub-Proxy-Secret "${INTERNAL_PROXY_SECRET}";
  }

  location = /api/admin/auth/login {
    client_max_body_size 4k;
    limit_req zone=admin_login burst=2 nodelay;
    proxy_pass http://qrhub_backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $qr_client_ip;
    proxy_set_header X-Real-IP $qr_client_ip;
    proxy_set_header X-Forwarded-For $qr_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-QRHub-Proxy-Secret "${INTERNAL_PROXY_SECRET}";
  }

  location = /api/analytics/browser-location {
    client_max_body_size 8k;
    limit_req zone=browser_location burst=2 nodelay;
    limit_req zone=tracking_global burst=20 nodelay;
    proxy_pass http://qrhub_backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $qr_client_ip;
    proxy_set_header X-Real-IP $qr_client_ip;
    proxy_set_header X-Forwarded-For $qr_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-QRHub-Proxy-Secret "${INTERNAL_PROXY_SECRET}";
  }

  location = /api/tracking/events {
    client_max_body_size 16k;
    limit_req zone=tracking_events burst=5 nodelay;
    limit_req zone=tracking_global burst=20 nodelay;
    proxy_pass http://qrhub_backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $qr_client_ip;
    proxy_set_header X-Real-IP $qr_client_ip;
    proxy_set_header X-Forwarded-For $qr_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-QRHub-Proxy-Secret "${INTERNAL_PROXY_SECRET}";
  }

  location ~ ^/api(/|$) {
    proxy_pass http://qrhub_backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $qr_client_ip;
    proxy_set_header X-Real-IP $qr_client_ip;
    proxy_set_header X-Forwarded-For $qr_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-QRHub-Proxy-Secret "${INTERNAL_PROXY_SECRET}";
  }

  location @qr_fallback {
    add_header Cache-Control "no-store, private, max-age=0";
    add_header Referrer-Policy "no-referrer";
    add_header X-Robots-Tag "noindex, nofollow";
    return 302 /enlaces;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
